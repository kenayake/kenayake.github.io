<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Pastel Gradient for Connections & Accents -->
    <linearGradient id="grad-pastel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>

    <!-- Dark Stone Gray Card Fill -->
    <linearGradient id="grad-stone-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2926" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.98" />
    </linearGradient>

    <!-- Pastel Gradient Line -->
    <linearGradient id="grad-line-pastel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Light Blue Glow -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Grid & Accents -->
  <g opacity="0.2">
    <circle cx="250" cy="210" r="185" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="250" cy="210" r="125" stroke="#c4b5fd" stroke-width="1" stroke-dasharray="2 4" />
  </g>

  <!-- Connection Data Paths with Pastel Gradient -->
  <path d="M120 110 L250 170 L380 110" stroke="url(#grad-line-pastel)" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M250 170 L250 270" stroke="url(#grad-line-pastel)" stroke-width="2.5" />
  <path d="M250 270 L130 330" stroke="url(#grad-line-pastel)" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M250 270 L370 330" stroke="url(#grad-line-pastel)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Node 1: REST & APIs (Top Center) -->
  <g transform="translate(170, 20)">
    <rect width="160" height="64" rx="10" fill="url(#grad-stone-card)" stroke="#3d3733" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="64" rx="10" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5" filter="url(#glow-blue)" />
    <circle cx="26" cy="32" r="10" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M22 32 L30 32 M26 28 L26 36" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" />
    <text x="46" y="29" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">REST &amp; APIs</text>
    <text x="46" y="46" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">HTTP / Webhooks</text>
  </g>

  <!-- Node 2: Core Backend Engine (Center) -->
  <g transform="translate(150, 140)">
    <rect width="200" height="84" rx="12" fill="url(#grad-stone-card)" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="12" y="12" width="176" height="60" rx="8" fill="#24201d" fill-opacity="0.8" stroke="#3d3733" stroke-width="1" />
    <circle cx="34" cy="42" r="14" fill="#0284c7" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="30" y="47" fill="#bae6fd" font-family="monospace" font-size="13" font-weight="700">☕</text>
    <text x="58" y="38" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Java &amp; Spring Boot</text>
    <text x="58" y="55" fill="#7dd3fc" font-family="monospace" font-size="10.5">Enterprise Backend</text>
  </g>

  <!-- Node 3: Middleware & Integration (Left) -->
  <g transform="translate(30, 240)">
    <rect width="170" height="70" rx="10" fill="url(#grad-stone-card)" stroke="#3d3733" stroke-width="1.5" />
    <circle cx="28" cy="35" r="10" fill="#a5b4fc" fill-opacity="0.2" stroke="#a5b4fc" stroke-width="1.5" />
    <text x="24" y="39" fill="#c4b5fd" font-size="11">🔄</text>
    <text x="48" y="31" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700">IBM WebMethods</text>
    <text x="48" y="48" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">IBM BAW Integration</text>
  </g>

  <!-- Node 4: Persistence / Databases (Right) -->
  <g transform="translate(300, 240)">
    <rect width="170" height="70" rx="10" fill="url(#grad-stone-card)" stroke="#3d3733" stroke-width="1.5" />
    <circle cx="28" cy="35" r="10" fill="#38bdf8" fill-opacity="0.2" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="23" y="40" fill="#7dd3fc" font-size="11">💾</text>
    <text x="48" y="31" fill="#f5f5f4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700">RDBMS Persistence</text>
    <text x="48" y="48" fill="#a8a29e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">MariaDB / PostgreSQL</text>
  </g>

  <!-- Bottom Pulse Status (Stone pill with light blue pulse) -->
  <g transform="translate(180, 360)">
    <rect width="140" height="32" rx="16" fill="#1c1917" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="4" fill="#38bdf8" filter="url(#glow-blue)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="20" fill="#7dd3fc" font-family="monospace" font-size="10.5" font-weight="600">SYSTEM HEALTHY</text>
  </g>
</svg>
