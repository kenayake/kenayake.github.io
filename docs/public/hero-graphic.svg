<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Decorative Grid & Accents -->
  <g opacity="0.25">
    <circle cx="250" cy="210" r="180" stroke="#10b981" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="250" cy="210" r="120" stroke="#34d399" stroke-width="1" stroke-dasharray="2 4" />
  </g>

  <!-- Connection Data Paths -->
  <path d="M120 110 L250 170 L380 110" stroke="url(#grad-line)" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M250 170 L250 270" stroke="url(#grad-line)" stroke-width="2.5" />
  <path d="M250 270 L130 330" stroke="url(#grad-line)" stroke-width="2" stroke-dasharray="6 4" />
  <path d="M250 270 L370 330" stroke="url(#grad-line)" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Node 1: API & Client Layer (Top Center) -->
  <g transform="translate(170, 20)">
    <rect width="160" height="64" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="160" height="64" rx="10" stroke="#10b981" stroke-width="1.5" opacity="0.6" filter="url(#glow)" />
    <circle cx="26" cy="32" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M22 32 L30 32 M26 28 L26 36" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" />
    <text x="46" y="29" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="700">REST &amp; APIs</text>
    <text x="46" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">HTTP / Webhooks</text>
  </g>

  <!-- Node 2: Core Backend Engine (Center) -->
  <g transform="translate(150, 140)">
    <rect width="200" height="84" rx="12" fill="url(#grad-card)" stroke="#10b981" stroke-width="2" />
    <rect x="12" y="12" width="176" height="60" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <circle cx="34" cy="42" r="14" fill="#059669" fill-opacity="0.3" stroke="#34d399" stroke-width="1.5" />
    <text x="30" y="47" fill="#34d399" font-family="monospace" font-size="13" font-weight="700">☕</text>
    <text x="58" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">Java &amp; Spring Boot</text>
    <text x="58" y="55" fill="#34d399" font-family="monospace" font-size="10.5">Enterprise Backend</text>
  </g>

  <!-- Node 3: Middleware & Integration (Left) -->
  <g transform="translate(30, 240)">
    <rect width="170" height="70" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="35" r="10" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
    <text x="24" y="39" fill="#60a5fa" font-size="11">🔄</text>
    <text x="48" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700">IBM WebMethods</text>
    <text x="48" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">IBM BAW Integration</text>
  </g>

  <!-- Node 4: Persistence / Databases (Right) -->
  <g transform="translate(300, 240)">
    <rect width="170" height="70" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="35" r="10" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1.5" />
    <text x="23" y="40" fill="#34d399" font-size="11">💾</text>
    <text x="48" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="700">RDBMS Persistence</text>
    <text x="48" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10">MariaDB / PostgreSQL</text>
  </g>

  <!-- Bottom Pulse Status -->
  <g transform="translate(180, 360)">
    <rect width="140" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="20" cy="16" r="4" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="20" fill="#34d399" font-family="monospace" font-size="10.5" font-weight="600">SYSTEM HEALTHY</text>
  </g>
</svg>
